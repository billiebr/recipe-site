<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a2350">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכונים">
<title>ספר המתכונים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a shuk stall — poster masthead, a shelf of colour-coded category blocks, recipe cards with patterned produce-coloured heads; a recipe opens as an index card. */
:root{
  --paper:#f7f7f3; --card:#ffffff; --ink:#2b1d30; --muted:#6c6270; --line:#e3e0e3; --rule:#e6edf3;
  --eggplant:#4a2350; --lemon:#f2c94c; --soft:#efeaf0; --danger:#c2412d;
  --display:"Karantina","Assistant",Impact,sans-serif; --hand:"Amatic SC","Assistant",cursive; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:14px; --shadow:0 1px 0 rgba(43,29,48,.06),0 8px 24px -14px rgba(43,29,48,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151117; --card:#201a23; --ink:#f1ebf2; --muted:#a99fae; --line:#342b38; --rule:#2b2a36;
  --eggplant:#d9b3e0; --lemon:#f2c94c; --soft:#2a222d; --danger:#ef8a74; --shadow:0 8px 24px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151117; --card:#201a23; --ink:#f1ebf2; --muted:#a99fae; --line:#342b38; --rule:#2b2a36;
  --eggplant:#d9b3e0; --lemon:#f2c94c; --soft:#2a222d; --danger:#ef8a74; --shadow:0 8px 24px -14px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
input,select,textarea,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px}
.mast .kicker{font-family:var(--hand);font-size:1.9rem;line-height:1;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(4rem,13vw,8.5rem);line-height:.82;margin:4px 0 0;letter-spacing:-.01em;color:var(--eggplant)}
h1 .dot{color:var(--tomato,#e0482f)}
.stats{font-weight:700;font-size:.95rem;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;align-items:center}
/* sticky search bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  margin-inline:-16px;padding:12px 16px 10px;margin-top:24px;border-top:3px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;inset-inline-start:16px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search{width:100%;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:12px 48px 12px 46px;font-size:1.05rem}
.search:focus{border-color:var(--eggplant);outline:none}
.search::-webkit-search-cancel-button{display:none}
.clear{position:absolute;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:1rem;line-height:1}
.kbd{position:absolute;inset-inline-end:14px;font-size:.78rem;font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:5px;padding:0 6px;pointer-events:none}
.result-line{font-size:.92rem;font-weight:600;color:var(--muted);min-height:1.2em}
.result-line b{color:var(--ink)}
mark{background:var(--lemon);color:#2b1d30;border-radius:3px;padding:0 1px}
.hit{color:var(--ink)!important;background:var(--soft);border-radius:6px;padding:4px 8px}
.hit em{font-style:normal;font-weight:800}
/* category sections */
main{display:flex;flex-direction:column;gap:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head h2{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.85;margin:0;color:var(--c);display:flex;align-items:baseline;gap:12px}
.section-head h2 .n{font-family:var(--body);font-size:1rem;font-weight:800;color:var(--muted)}
.section-head::after{content:"";flex:1;order:1;height:3px;background:var(--c);border-radius:2px;margin-bottom:8px;opacity:.85}
.section-head h2{order:0}.linkbtn{order:2}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:800;cursor:pointer;padding:4px 0;white-space:nowrap}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer;background:var(--eggplant);color:var(--paper);letter-spacing:.01em;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.big{font-size:1.05rem;padding:13px 22px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55;cursor:default;transform:none}

/* category shelf */
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.wrap>main{margin-top:26px}
.chip{--c:var(--ink);--t:var(--paper);display:flex;align-items:baseline;gap:10px;border:2px solid var(--c);background:transparent;color:var(--ink);border-radius:10px;padding:6px 14px 4px;cursor:pointer;transition:background .15s,color .15s,transform .12s}
.chip b{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1}
.chip .n{font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums;opacity:.75}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--c);color:var(--t)}
.chip.zero{opacity:.45}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;align-content:start}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:right;cursor:pointer;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.head{--c:#888;--t:#fff;position:relative;height:150px;background-color:var(--c);color:var(--t);overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px}
.head::before{content:"";position:absolute;inset:0;opacity:.22;background-image:var(--pat);background-size:var(--ps,22px 22px)}
.head .glyph{position:absolute;left:-6px;bottom:-34px;font-family:var(--display);font-weight:700;font-size:12rem;line-height:1;opacity:.9;mix-blend-mode:soft-light}
.head .lbl{position:relative;font-family:var(--hand);font-size:1.7rem;line-height:1;background:var(--t);color:var(--c);padding:4px 12px 2px;border-radius:6px;transform:rotate(-2deg)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:.95;margin:0;text-wrap:balance}
/* vegan recipes: a small green leaf behind the title */
.vegan{position:relative;isolation:isolate}
.vegan::before{content:"";position:absolute;inset-inline-end:-4px;top:-10px;width:46px;height:46px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%234f9a3a%22%20d%3D%22M56%206C31%207%2011%2020%2010%2041c0%206%202%2011%204%2015%203-11%2011-22%2026-30-12%2010-18%2020-21%2031%204%202%208%203%2012%203%2021%200%2028-23%2025-54z%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.4;z-index:-1;pointer-events:none}
.sheet h2.vegan::before{width:64px;height:64px;top:-14px;inset-inline-end:-48px;opacity:.6}
/* vegan / not vegan switch in the recipe form */
.toggle{border:0;margin:0;padding:0;min-width:0}
.toggle legend{font-weight:800;font-size:.92rem;padding:0;margin-bottom:5px}
.toggle .opts{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--card)}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle span{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.toggle input:checked+span{background:var(--ink);color:var(--paper)}
.toggle input.v:checked+span{background:#3f7f2e;color:#fff}
.toggle input:focus-visible+span{outline:3px solid var(--lemon);outline-offset:2px}
.toggle .leaf{width:16px;height:16px;flex:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%234f9a3a%22%20d%3D%22M56%206C31%207%2011%2020%2010%2041c0%206%202%2011%204%2015%203-11%2011-22%2026-30-12%2010-18%2020-21%2031%204%202%208%203%2012%203%2021%200%2028-23%2025-54z%22/%3E%3C/svg%3E") no-repeat center/contain}
.toggle input.v:checked+span .leaf{filter:brightness(2.2)}
.card p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.meta span{font-size:.78rem;font-weight:700;background:var(--soft);border-radius:6px;padding:2px 8px}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:var(--r);padding:46px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--ink);margin-bottom:8px}
.status{font-size:.88rem;color:var(--muted);margin-top:14px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(21,12,24,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px 40px;z-index:10}
.sheet{background:var(--paper);color:var(--ink);border-radius:18px;width:100%;max-width:880px;position:relative;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.sheet .head{height:auto;min-height:190px;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;padding:26px clamp(20px,4vw,44px) 22px}
.sheet .head .glyph{font-size:17rem;bottom:-60px}
.sheet h2{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(3rem,8vw,4.8rem);line-height:.88;margin:0;text-wrap:balance;max-width:85%}
.sheet .byline{position:relative;font-weight:700;opacity:.9}
.close{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff;cursor:pointer;font-size:1.1rem;z-index:2}
.inner{padding:24px clamp(20px,4vw,44px) 30px}
.intro{font-size:1.08rem;max-width:62ch;margin:0 0 16px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.facts div{border:2px solid var(--ink);border-radius:10px;padding:4px 12px}
.facts small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.facts b{font-weight:700}
.recipe-body{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.3fr);gap:34px;align-items:start}
.h4{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1;margin:0 0 12px}
.index{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:18px 20px 20px;position:relative;
  background-image:linear-gradient(var(--card),var(--card)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-size:100% 52px,100% 100%;background-repeat:no-repeat,repeat;background-position:top,0 4px}
.index::after{content:"";position:absolute;top:0;bottom:0;right:44px;border-right:2px solid color-mix(in srgb,var(--tomato,#e0482f) 45%,transparent)}
ul.ing{list-style:none;margin:0;padding:0 0 0 0}
ul.ing li{min-height:32px;display:flex;align-items:center}
ul.ing label{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%}
ul.ing input{accent-color:var(--eggplant);width:18px;height:18px;flex:none;margin:0}
ul.ing input:checked + span{text-decoration:line-through;color:var(--muted)}
ul.ing li.grp{font-family:var(--hand);font-size:1.6rem;color:var(--eggplant);padding-right:0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:52px 1fr;gap:8px;cursor:pointer;border-radius:10px;padding:8px 6px;transition:background .15s,opacity .15s}
ol.steps li:hover{background:var(--soft)}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:2.7rem;line-height:.8;color:var(--cat,var(--eggplant));text-align:center}
ol.steps li.done{opacity:.4}
ol.steps li.done::before{content:"✓";font-family:var(--body);font-size:1.6rem}
.notes{margin-top:26px;font-family:var(--hand);font-size:1.7rem;line-height:1.2;background:var(--lemon);color:#2b1d30;border-radius:4px;padding:14px 18px;transform:rotate(-.6deg);max-width:560px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:30px;padding-top:18px;border-top:2px solid var(--line)}
.sheet-foot a{color:var(--ink);font-weight:800;text-decoration-color:var(--lemon);text-decoration-thickness:3px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* form */
.form-head{padding:26px clamp(20px,4vw,44px) 0}
.form-head h2{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:.9;margin:0;color:var(--eggplant)}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink);border-radius:12px;padding:3px;gap:3px;margin:16px 0 4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 16px;cursor:pointer;font-weight:800}
.seg button.on{background:var(--ink);color:var(--paper)}
.form{display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-weight:800;font-size:.92rem}
.f .hint{font-size:.82rem;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 13px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--eggplant);outline:none}
.f textarea{resize:vertical;min-height:90px;line-height:1.55}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.callout{background:var(--card);border-right:6px solid var(--lemon);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.callout ol{margin:6px 0 0;padding-inline-start:20px}
.err{color:var(--danger);font-weight:700;font-size:.92rem}
.hint.live{font-weight:700;color:var(--muted)}

@media (max-width:760px){
  .mast{grid-template-columns:1fr}
  .shelf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .shelf::-webkit-scrollbar{display:none}
  .chip b{font-size:1.35rem}
  .kbd{display:none}
  .section-head h2{font-size:2.4rem}
  .chip{flex:none}
  .recipe-body{grid-template-columns:1fr}
  .sheet h2{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover,.chip:hover,.btn:hover{transform:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.login form{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px clamp(18px,5vw,36px);width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:clamp(3.4rem,14vw,4.6rem)}
.login p{margin:0;color:var(--muted)}
.link-box{margin-bottom:6px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow input{flex:1 1 220px;min-width:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800;margin:18px 0 14px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.logout{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0;margin-top:10px}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <div class="mast"><div><div class="kicker">מה מבשלים היום?</div><h1>ספר המתכונים<span class="dot">.</span></h1></div></div>
    <p>הקלידו את הסיסמה המשפחתית כדי להיכנס.</p>
    <div class="f"><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn big" type="submit" id="loginBtn">כניסה</button>
    <span class="err" id="loginErr"></span>
  </form>
</div>
<div id="app" hidden>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="kicker">מה מבשלים היום?</div>
      <h1>ספר המתכונים<span class="dot">.</span></h1>
      <div class="stats" id="count">טוען מתכונים…</div>
    </div>
    <div class="tools"><button id="addBtn" class="btn big">+ מתכון חדש</button></div>
  </header>
  <div class="bar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="search" type="search" placeholder="חיפוש לפי שם, מצרך או קטגוריה" aria-label="חיפוש מתכונים" autocomplete="off" enterkeyhint="search">
      <button id="clr" class="clear" type="button" aria-label="ניקוי החיפוש" hidden>✕</button>
      <span id="kbd" class="kbd" aria-hidden="true">/</span>
    </div>
    <nav class="shelf" id="tabs" aria-label="קטגוריות"></nav>
    <div class="result-line" id="resultLine" aria-live="polite"></div>
  </div>
  <main id="grid"></main>
  <div class="status" id="status"></div>
  <button class="logout" id="logout" type="button">יציאה מהספר</button>
</div>
<div id="modal"></div>
</div>
<script>
const CATS=["עיקריות","מנות ראשונות","סלטים","מרקים","תוספות","מאפים ולחמים","עוגות וקינוחים","נשנושים","ארוחת בוקר","רטבים וממרחים","משקאות"];
/* produce palette: [background, text, pattern] */
const DOTS="radial-gradient(currentColor 2px,transparent 2.5px)";
const STRIPES="repeating-linear-gradient(45deg,currentColor 0 3px,transparent 3px 14px)";
const GRID="linear-gradient(currentColor 1.5px,transparent 1.5px),linear-gradient(90deg,currentColor 1.5px,transparent 1.5px)";
const RINGS="radial-gradient(circle,transparent 7px,currentColor 7.5px 9px,transparent 9.5px)";
const WAVES="repeating-radial-gradient(circle at 0 100%,transparent 0 10px,currentColor 10px 12px)";
const STYLE={
  "עיקריות":["#d9432b","#fff8f0",DOTS],"מנות ראשונות":["#1f6f8b","#f1fbff",RINGS],"סלטים":["#4f7a28","#f6ffe9",STRIPES],
  "מרקים":["#c56a1c","#fff6ea",WAVES],"תוספות":["#7a6a3a","#fffbea",GRID],"מאפים ולחמים":["#d6a65a","#2b1d30",DOTS],
  "עוגות וקינוחים":["#c23b74","#fff1f7",RINGS],"נשנושים":["#f2c94c","#2b1d30",STRIPES],"ארוחת בוקר":["#f08a3c","#2b1d30",GRID],
  "רטבים וממרחים":["#5b2a5e","#fbefff",WAVES],"משקאות":["#2a8c7a","#effffb",DOTS]
};
const EXTRA=[["#6b4c9a","#f6f0ff",RINGS],["#3b6e57","#effff6",STRIPES],["#a23b2b","#fff3ee",GRID],["#2d5d9b","#eef5ff",WAVES]];
function styleOf(c){if(STYLE[c])return STYLE[c];let h=0;for(const ch of String(c||""))h=(h*31+ch.charCodeAt(0))|0;return EXTRA[Math.abs(h)%EXTRA.length];}
function headVars(c){const[bg,fg,pat]=styleOf(c);const ps=pat===GRID?"26px 26px":pat===WAVES?"40px 40px":pat===RINGS?"30px 30px":"22px 22px";return `--c:${bg};--t:${fg};--pat:${pat};--ps:${ps};color:${fg}`;}
function initial(t){const m=String(t||"").match(/[\p{L}]/u);return m?m[0]:"•";}

let recipes=[], cat="הכל", query="", ready=false, wakeLock=null, PW="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines=t=>String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);

try{cat=localStorage.getItem("recipes.cat")||"הכל";}catch{}

/* Search normalisation: ignore niqqud, quote marks, case and final letters, so "עוף" finds "עופות" and "קציצות" finds "קְצִיצוֹת". */
const SKIP=/[֑-ׇ״"׳'`]/;
const FINAL={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const ncf=c=>FINAL[c]||c.toLowerCase();
function norm(s){let o="";for(const c of String(s??"")){if(!SKIP.test(c))o+=ncf(c);}return o.replace(/\s+/g," ").trim();}
function terms(){return norm(query).split(" ").filter(Boolean);}
/* Wrap every match of the search terms in <mark>, mapping positions back to the original text. */
function hl(text,ts){
  text=String(text??"");if(!ts.length)return esc(text);
  let n="",map=[];[...text].forEach((c,i)=>{if(!SKIP.test(c)){const x=ncf(c);for(const _ of x){n+=_;map.push(i);}}});
  const chars=[...text],on=new Array(chars.length).fill(false);
  ts.forEach(t=>{let i=n.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)on[map[k]]=true;i=n.indexOf(t,i+t.length);}});
  chars.forEach((c,i)=>{if(i&&on[i-1]&&SKIP.test(c))on[i]=true;});
  let out="",open=false;chars.forEach((c,i)=>{if(on[i]&&!open){out+="<mark>";open=true;}if(!on[i]&&open){out+="</mark>";open=false;}out+=esc(c);});
  return out+(open?"</mark>":"");
}
const isVegan=r=>r.vegan===true||(r.vegan!==false&&/טבעונ|vegan/i.test([r.title,r.category,r.intro,r.notes].join(" ")));
function index(r){
  r._t=norm(r.title);
  r._all=norm([r.title,r.category,r.intro,r.author,r.notes,isVegan(r)?"טבעוני":"",...(r.ingredients||[]),...(r.steps||[])].join(" \n "));
  return r;
}
function matches(r,ts){return ts.every(t=>r._all.includes(t));}
/* Where else did it match? Show the first ingredient or step that holds a term the title lacks. */
function hitLine(r,ts){
  const missing=ts.filter(t=>!r._t.includes(t));if(!missing.length)return "";
  const ing=(r.ingredients||[]).find(x=>missing.some(t=>norm(x).includes(t)));
  if(ing)return `<p class="hit"><em>מצרך:</em> ${hl(ing,ts)}</p>`;
  const st=(r.steps||[]).find(x=>missing.some(t=>norm(x).includes(t)));
  if(st)return `<p class="hit"><em>בהכנה:</em> ${hl(st,ts)}</p>`;
  return "";
}

function catOrder(c){const i=CATS.indexOf(c);return i<0?CATS.length:i;}
function allCats(){const extra=[...new Set(recipes.map(r=>r.category).filter(c=>c&&!CATS.includes(c)))];return [...CATS,...extra];}
const byNew=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
const catOf=r=>r.category||"שונות";

function card(r,ts){
  const hit=ts.length?hitLine(r,ts):"";
  return `<button class="card" data-id="${esc(r.id)}">
    <div class="head" style="${headVars(r.category)}"><span class="glyph" aria-hidden="true">${esc(initial(r.title))}</span><span class="lbl">${esc(catOf(r))}</span></div>
    <div class="body"><h3${isVegan(r)?' class="vegan" title="טבעוני"':""}>${hl(r.title,ts)}</h3>${hit||(r.intro?`<p>${hl(r.intro,ts)}</p>`:"")}
    <div class="meta">${r.time?`<span>${esc(r.time.replace(/\s*\(.*\)/,""))}</span>`:""}${r.servings?`<span>${esc(r.servings)}</span>`:""}${r.author?`<span>${esc(r.author)}</span>`:""}</div></div></button>`;
}

function render(){
  const ts=terms();
  const pool=ts.length?recipes.filter(r=>matches(r,ts)):recipes;
  const counts={};pool.forEach(r=>{const c=catOf(r);counts[c]=(counts[c]||0)+1;});
  const cats=Object.keys(counts).sort((a,b)=>catOrder(a)-catOrder(b)||a.localeCompare(b,"he"));
  if(cat!=="הכל"&&!cats.includes(cat)&&!ts.length&&recipes.length)cat="הכל";
  const shelfCats=ts.length?(cats.includes(cat)||cat==="הכל"?cats:[...cats,cat]):allCats().filter(c=>counts[c]||CATS.includes(c));
  $("#tabs").innerHTML=[`<button class="chip ${cat==="הכל"?"on":""}" data-cat="הכל" aria-pressed="${cat==="הכל"}" style="--c:var(--ink);--t:var(--paper)"><b>הכל</b><span class="n">${pool.length}</span></button>`]
    .concat(shelfCats.map(c=>{const[bg,fg]=styleOf(c);return `<button class="chip ${c===cat?"on":""} ${counts[c]?"":"zero"}" data-cat="${esc(c)}" aria-pressed="${c===cat}" style="--c:${bg};--t:${fg}"><b>${esc(c)}</b><span class="n">${counts[c]||0}</span></button>`;})).join("");
  const nCats=new Set(recipes.map(catOf)).size;
  $("#count").textContent=recipes.length?`${recipes.length} מתכונים · ${nCats} קטגוריות`:(ready?"הספר מחכה למתכון הראשון":$("#count").textContent);
  $("#clr").hidden=!query;$("#kbd").hidden=!!query;

  let list=pool.filter(r=>cat==="הכל"||catOf(r)===cat);
  if(ts.length)list.sort((a,b)=>(ts.every(t=>b._t.includes(t))-ts.every(t=>a._t.includes(t)))||byNew(a,b));else list.sort(byNew);

  const rl=$("#resultLine");
  if(ts.length){
    const inCat=cat==="הכל"?"":` בקטגוריה ${esc(cat)}`;
    rl.innerHTML=list.length?`נמצאו <b>${list.length}</b> מתכונים עבור ״${esc(query.trim())}״${inCat}`:`לא נמצאו מתכונים עבור ״${esc(query.trim())}״${inCat}`;
  }else rl.innerHTML=cat==="הכל"?"":`מציג <b>${list.length}</b> מתכונים בקטגוריה ${esc(cat)}`;
  rl.hidden=!rl.innerHTML;

  const g=$("#grid");
  if(!recipes.length){
    g.innerHTML=ready?`<div class="empty"><strong>הספר ריק</strong>לחצו על ״מתכון חדש״ כדי להוסיף את המתכון הראשון.</div>`:`<div class="empty"><strong>טוען את הספר…</strong>המתכונים יופיעו כאן לפי קטגוריות.</div>`;return;
  }
  if(!list.length){
    const elsewhere=ts.length&&cat!=="הכל"&&pool.length;
    g.innerHTML=`<div class="empty"><strong>${ts.length?"לא מצאתי":"עוד אין כאן כלום"}</strong>${elsewhere?`יש ${pool.length} תוצאות בקטגוריות אחרות.<br><button class="btn" data-cat="הכל" style="margin-top:14px">חיפוש בכל הקטגוריות</button>`:ts.length?"נסו מילה אחרת, או חלק ממילה (למשל ״עוג״ במקום ״עוגיות״).":"בחרו קטגוריה אחרת, או הוסיפו מתכון חדש."}</div>`;return;
  }
  if(cat==="הכל"&&!ts.length){
    g.innerHTML=cats.map(c=>{const rs=list.filter(r=>catOf(r)===c);const[bg]=styleOf(c);
      return `<section style="--c:${bg}"><div class="section-head"><h2>${esc(c)}<span class="n">${rs.length}</span></h2>${cats.length>1?`<button class="linkbtn" data-cat="${esc(c)}">רק ${esc(c)} ←</button>`:""}</div><div class="grid">${rs.map(r=>card(r,ts)).join("")}</div></section>`;}).join("");
  }else{
    g.innerHTML=`<div class="grid">${list.map(r=>card(r,ts)).join("")}</div>`;
  }
}
function setCat(c){cat=c;try{localStorage.setItem("recipes.cat",c);}catch{}render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b&&!b.closest("#modal"))setCat(b.dataset.cat);});
$("#q").oninput=e=>{const was=query;query=e.target.value;if(!was.trim()&&query.trim()&&cat!=="הכל")cat="הכל";render();};
$("#q").onkeydown=e=>{if(e.key==="Escape"&&query){e.stopPropagation();clearSearch();}};
function clearSearch(){query="";$("#q").value="";render();$("#q").focus();}
$("#clr").onclick=clearSearch;
document.addEventListener("keydown",e=>{if(e.key==="/"&&!$("#ov")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus();}});
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".card");if(b)openRecipe(b.dataset.id);});
$("#addBtn").onclick=()=>openForm(null);

function closeModal(){$("#modal").innerHTML="";releaseWake();document.body.style.overflow="";}
function shell(html){
  $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true"><button class="close" id="x" aria-label="סגירה">✕</button>${html}</div></div>`;
  document.body.style.overflow="hidden";
  $("#x").onclick=closeModal;$("#ov").onclick=e=>{if(e.target.id==="ov")closeModal();};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov"))closeModal();});

function openRecipe(id){
  const r=recipes.find(x=>x.id===id);if(!r)return;
  const[bg]=styleOf(r.category);const ts=terms();
  const ing=(r.ingredients||[]).map((t,i)=>/[:：]$/.test(t)?`<li class="grp">${esc(t.replace(/[:：]$/,""))}</li>`:`<li><label><input type="checkbox" id="ing${i}"><span>${hl(t,ts)}</span></label></li>`).join("");
  const steps=(r.steps||[]).map(t=>`<li><span>${hl(t,ts)}</span></li>`).join("");
  const fact=(k,v)=>v?`<div><small>${k}</small><b>${esc(v)}</b></div>`:"";
  shell(`<div class="head" style="${headVars(r.category)}"><span class="glyph" aria-hidden="true">${esc(initial(r.title))}</span>
      <span class="lbl">${esc(r.category||"שונות")}</span><h2${isVegan(r)?' class="vegan" title="טבעוני"':""}>${esc(r.title)}</h2>${r.author?`<div class="byline">מאת ${esc(r.author)}</div>`:""}</div>
    <div class="inner" style="--cat:${bg}">
      ${r.intro?`<p class="intro">${esc(r.intro)}</p>`:""}
      <div class="facts">${fact("זמן",r.time)}${fact("כמות",r.servings)}${fact("מצרכים",(r.ingredients||[]).filter(t=>!/[:：]$/.test(t)).length||"")}</div>
      <div class="recipe-body">
        <section><div class="h4">מצרכים</div><div class="index"><ul class="ing">${ing||"<li>—</li>"}</ul></div></section>
        <section><div class="h4">ההכנה</div><ol class="steps" id="steps">${steps||"<li>—</li>"}</ol></section>
      </div>
      ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:""}
      <div class="sheet-foot"><div>${r.source?`מקור: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(shortUrl(r.source))}</a>`:""}</div>
      <div class="row-btns"><button class="btn ghost" id="cook">מסך דלוק בזמן בישול</button><button class="btn ghost" id="edit">עריכה</button><span id="delWrap"><button class="btn ghost" id="del">מחיקה</button></span></div></div>
    </div>`);
  $("#steps").onclick=e=>{const li=e.target.closest("li");if(li)li.classList.toggle("done");};
  $("#edit").onclick=()=>openForm(r);
  $("#del").onclick=()=>{$("#delWrap").innerHTML=`<span class="row-btns">למחוק לצמיתות? <button class="btn warn" id="yes">מחיקה</button><button class="btn ghost" id="no">ביטול</button></span>`;
    $("#no").onclick=()=>openRecipe(id);
    $("#yes").onclick=async()=>{try{await api("DELETE",null,id);recipes=recipes.filter(x=>x.id!==id);closeModal();render();}catch(e){$("#delWrap").innerHTML=`<span class="err">המחיקה נכשלה. נסו שוב.</span>`;}};};
  $("#cook").onclick=async()=>{try{wakeLock=await navigator.wakeLock.request("screen");$("#cook").textContent="המסך יישאר דלוק ✓";$("#cook").disabled=true;}catch{$("#cook").textContent="הדפדפן לא מאפשר";$("#cook").disabled=true;}};
}
function releaseWake(){try{wakeLock&&wakeLock.release();}catch{}wakeLock=null;}
function shortUrl(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch{return u;}}

function openForm(r){
  const isNew=!r||!r.id; const fromLink=isNew&&!!(r&&r.title); r=r||{};
  const catOpts=allCats().map(c=>`<option ${c===r.category?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">קטגוריה חדשה…</option>`;
  const linkUI=isNew&&!fromLink?`<div class="callout link-box"><div class="f"><label for="fUrl">הוספה מלינק</label>
      <span class="hint">מדביקים לינק לדף המתכון, והספר ממלא את כל השדות ובוחר קטגוריה. אחר כך רק בודקים ושומרים.</span>
      <div class="linkrow"><input id="fUrl" type="url" dir="ltr" inputmode="url" placeholder="https://" autocomplete="off"><button class="btn" id="readUrl" type="button">קרא את המתכון</button></div>
      <span id="uMsg" class="hint live" aria-live="polite"></span></div></div>
    <div class="or">או מלאו בעצמכם</div>`:"";
  shell(`<div class="form-head"><h2>${!isNew?"עריכת מתכון":fromLink?"בדקו ושמרו":"מתכון חדש"}</h2></div>
    <div class="inner">${linkUI}<form class="form" id="mf">
    <div class="f"><label for="fTitle">שם המתכון</label><input id="fTitle" required value="${esc(r.title)}"></div>
    <fieldset class="toggle"><legend>טבעוני?</legend><div class="opts">
      <label><input type="radio" name="vegan" id="fVeganYes" class="v" value="1" ${(r.title||r.id)&&isVegan(r)?"checked":""}><span><i class="leaf" aria-hidden="true"></i>טבעוני</span></label>
      <label><input type="radio" name="vegan" id="fVeganNo" value="0" ${(r.title||r.id)&&isVegan(r)?"":"checked"}><span>לא טבעוני</span></label>
    </div></fieldset>
    <div class="row"><div class="f"><label for="fCat">קטגוריה</label><select id="fCat">${catOpts}</select><input id="fCatNew" placeholder="שם הקטגוריה" hidden></div>
      <div class="f"><label for="fTime">זמן</label><input id="fTime" value="${esc(r.time)}" placeholder="45 דקות"></div>
      <div class="f"><label for="fServ">כמות</label><input id="fServ" value="${esc(r.servings)}" placeholder="4 מנות"></div></div>
    <div class="row"><div class="f"><label for="fAuthor">מאת</label><input id="fAuthor" value="${esc(r.author)}"></div>
      <div class="f"><label for="fSrc">לינק למקור</label><input id="fSrc" dir="ltr" value="${esc(r.source)}"></div></div>
    <div class="f"><label for="fIntro">תיאור קצר</label><textarea id="fIntro" style="min-height:60px">${esc(r.intro)}</textarea></div>
    <div class="f"><label for="fIng">מצרכים</label><span class="hint">שורה לכל מצרך. שורה שמסתיימת בנקודתיים היא כותרת של קבוצה, למשל ״לרוטב:״</span><textarea id="fIng" style="min-height:170px">${esc((r.ingredients||[]).join("\n"))}</textarea></div>
    <div class="f"><label for="fSteps">שלבי ההכנה</label><span class="hint">שורה לכל שלב</span><textarea id="fSteps" style="min-height:190px">${esc((r.steps||[]).join("\n"))}</textarea></div>
    <div class="f"><label for="fNotes">הערות</label><textarea id="fNotes" style="min-height:60px">${esc(r.notes)}</textarea></div>
    <div class="row-btns"><button class="btn big" type="submit" id="save">שמירה בספר</button><span id="sMsg" class="err"></span></div></form></div>`);
  if(linkUI){
    const read=async()=>{
      const url=$("#fUrl").value.trim();
      if(!url){$("#uMsg").textContent="הדביקו קודם לינק למתכון.";return;}
      $("#readUrl").disabled=true;$("#uMsg").textContent="קורא את המתכון…";
      try{const {recipe}=await api("POST",{url,categories:allCats()},null,"/api/import");openForm(recipe);}
      catch(err){$("#readUrl").disabled=false;$("#uMsg").textContent=err.message;}
    };
    $("#readUrl").onclick=read;
    $("#fUrl").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();read();}};
    $("#fUrl").focus();
  }
  $("#fCat").onchange=e=>{$("#fCatNew").hidden=e.target.value!=="__new";};
  if(r.category&&!allCats().includes(r.category)){$("#fCat").value="__new";$("#fCatNew").hidden=false;$("#fCatNew").value=r.category;}
  $("#mf").onsubmit=async e=>{
    e.preventDefault();
    const c=$("#fCat").value==="__new"?$("#fCatNew").value.trim()||"שונות":$("#fCat").value;
    const data={id:r.id,title:$("#fTitle").value.trim(),category:c,time:$("#fTime").value.trim(),servings:$("#fServ").value.trim(),author:$("#fAuthor").value.trim(),
      source:$("#fSrc").value.trim(),intro:$("#fIntro").value.trim(),ingredients:lines($("#fIng").value),steps:lines($("#fSteps").value),notes:$("#fNotes").value.trim(),vegan:$("#fVeganYes").checked,createdAt:r.createdAt};
    $("#save").disabled=true;$("#sMsg").textContent="";
    try{const {recipe}=await api("POST",data);
      recipes=recipes.filter(x=>x.id!==recipe.id).concat(index(recipe));cat=c;render();openRecipe(recipe.id);}
    catch(err){$("#save").disabled=false;$("#sMsg").textContent=err.message;}
  };
}

/* Talking to the site's API. The family password travels in a header; a 401 sends the viewer back to the login screen. */
const IMPORT_ERRORS={bad_url:"זה לא נראה כמו לינק לאתר. בדקו שהוא מתחיל ב-https://",fetch_failed:"לא הצלחתי לפתוח את הדף. בדקו את הלינק, או מלאו את המתכון בעצמכם.",
  no_recipe:"לא מצאתי מתכון בדף הזה.",needs_ai:"האתר הזה לא מסמן את המתכון בצורה שאפשר לקרוא אוטומטית. מלאו אותו בעצמכם.",busy:"הקריאה האוטומטית הגיעה למכסה היומית החינמית. נסו שוב מחר, או מלאו את המתכון בעצמכם.",read_failed:"לא הצלחתי לקרוא את המתכון. נסו שוב, או מלאו אותו בעצמכם."};
async function api(method,body,id,path="/api/recipes"){
  let res;
  try{res=await fetch(path+(id?`?id=${encodeURIComponent(id)}`:""),{method,headers:{"x-family-password":PW,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});}
  catch{throw new Error("אין חיבור לאינטרנט. נסו שוב.");}
  if(res.status===401){showLogin("הסיסמה השתנתה. הקלידו אותה שוב.");throw new Error("צריך להתחבר מחדש.");}
  const out=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(out.error==="no_password_configured"?"עוד לא הוגדרה סיסמה משפחתית באתר.":(IMPORT_ERRORS[out.error]||"הפעולה נכשלה. נסו שוב.")+(out.detail?` (פרטים: ${out.detail})`:""));
  return out;
}
async function load(){const {recipes:list}=await api("GET");recipes=list.map(index);ready=true;render();}
function showLogin(msg){$("#app").hidden=true;$("#login").hidden=false;$("#loginErr").textContent=msg||"";$("#pw").focus();}
async function enter(pw){
  PW=pw;$("#loginBtn").disabled=true;$("#loginErr").textContent="";
  try{
    const res=await fetch("/api/recipes",{headers:{"x-family-password":pw}});
    if(res.status===401){try{localStorage.removeItem("recipes.pw");}catch{}showLogin(pw?"הסיסמה לא נכונה.":"");return;}
    const out=await res.json();
    if(!res.ok)throw new Error(out.error==="no_password_configured"?"עוד לא הוגדרה סיסמה משפחתית באתר.":"לא הצלחתי לטעון את הספר.");
    try{localStorage.setItem("recipes.pw",pw);}catch{}
    recipes=out.recipes.map(index);ready=true;
    $("#login").hidden=true;$("#app").hidden=false;render();
  }catch(e){showLogin(e.message||"אין חיבור לאינטרנט. נסו שוב.");}
  finally{$("#loginBtn").disabled=false;}
}
$("#loginForm").onsubmit=e=>{e.preventDefault();enter($("#pw").value);};
