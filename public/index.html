<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f5d46">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכונים">
<title>ספר המתכונים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a card-box index. A sticky search bar on top, category tabs on the side (chips under the search on phones), recipes grouped under category headings. A recipe opens as a full sheet. */
:root{
  --paper:#f3f5ef; --card:#ffffff; --ink:#1f2a22; --muted:#5d6b60; --line:#d7ddd2;
  --herb:#2f5d46; --herb-soft:#e2ece5; --saffron:#e3a21a; --saffron-soft:#fbefd2; --danger:#b3412e;
  --mark:#f7dc8f; --bar:rgba(243,245,239,.94);
  --display:"Suez One","Assistant",Georgia,serif; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a16; --card:#1c241f; --ink:#e8ede6; --muted:#9eaea2; --line:#2e3a32;
  --herb:#7fc29c; --herb-soft:#22362a; --saffron:#f0b941; --saffron-soft:#3a2f14; --danger:#e57a65;
  --mark:#6b5217; --bar:rgba(20,26,22,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a16; --card:#1c241f; --ink:#e8ede6; --muted:#9eaea2; --line:#2e3a32;
  --herb:#7fc29c; --herb-soft:#22362a; --saffron:#f0b941; --saffron-soft:#3a2f14; --danger:#e57a65;
  --mark:#6b5217; --bar:rgba(20,26,22,.94); color-scheme:dark}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block-end:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.1rem);line-height:1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:.95rem;color:var(--muted);font-weight:600;margin-top:8px;letter-spacing:.02em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--herb);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:var(--paper)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* sticky search bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;inset-inline-start:16px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:12px 48px 12px 46px;font-size:1.05rem}
.search:focus{border-color:var(--herb);outline:none;box-shadow:0 0 0 3px var(--herb-soft)}
.search::-webkit-search-cancel-button{display:none}
.clear{position:absolute;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--herb-soft);cursor:pointer;font-size:1rem;line-height:1}
.kbd{position:absolute;inset-inline-end:14px;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;pointer-events:none}
.result-line{font-size:.92rem;color:var(--muted);min-height:1.2em}
.result-line b{color:var(--ink)}
.chips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}

.layout{display:grid;grid-template-columns:210px 1fr;gap:28px;margin-top:22px}
nav.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);align-self:start}
nav.tabs button,.chips button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;background:transparent;border:0;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button{border-inline-start:4px solid transparent;padding:8px 12px;border-radius:0 var(--r) var(--r) 0}
nav.tabs button:hover{background:var(--herb-soft);color:var(--ink)}
nav.tabs button.on{border-inline-start-color:var(--saffron);background:var(--card);color:var(--ink)}
.n{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.chips button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.chips button.on{background:var(--herb);border-color:var(--herb);color:var(--paper)}
.chips button.on .n{color:inherit;opacity:.8}

main{min-width:0;display:flex;flex-direction:column;gap:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--saffron);padding-bottom:6px;margin-bottom:14px}
.section-head h2{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1.2;margin:0;display:flex;align-items:baseline;gap:10px}
.section-head .n{font-family:var(--body);font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--herb);font-weight:700;cursor:pointer;padding:4px 0;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-content:start;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:right;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--herb)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.03em;background:var(--saffron-soft);color:var(--ink);padding:2px 10px;border-radius:999px}
.card h3{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.2;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .hit{color:var(--ink);font-size:.88rem;background:var(--herb-soft);border-radius:6px;padding:4px 8px;-webkit-line-clamp:2}
.card .hit em{font-style:normal;font-weight:700;color:var(--herb)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);margin-top:auto}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.status{font-size:.85rem;color:var(--muted);margin-top:10px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px 40px;z-index:10}
.sheet{background:var(--card);color:var(--ink);border-radius:14px;width:100%;max-width:820px;padding:28px clamp(18px,4vw,40px);position:relative}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.15;margin:8px 0 6px;text-wrap:balance}
.close{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.2rem}
.intro{color:var(--muted);max-width:62ch;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.facts span{background:var(--herb-soft);border-radius:6px;padding:4px 10px;font-size:.88rem;font-weight:600}
.recipe-body{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:32px}
.recipe-body h4{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--saffron)}
ul.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.ing label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.ing input{margin-top:5px;accent-color:var(--herb);width:17px;height:17px;flex:none}
ul.ing input:checked + span{text-decoration:line-through;color:var(--muted)}
ul.ing li.grp{font-weight:700;margin-top:10px;color:var(--herb)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;cursor:pointer;border-radius:8px;padding:4px}
ol.steps li::before{content:counter(s);font-family:var(--display);width:30px;height:30px;border-radius:50%;background:var(--herb);color:var(--paper);display:grid;place-items:center;font-size:.95rem}
ol.steps li.done{opacity:.45}
.notes{margin-top:22px;background:var(--saffron-soft);border-radius:8px;padding:12px 16px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.sheet-foot a{color:var(--herb);font-weight:600;word-break:break-all}
/* form */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin:10px 0 16px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--herb);color:var(--paper)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-weight:700;font-size:.9rem}
.f .hint{font-size:.8rem;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.f textarea{resize:vertical;min-height:90px;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.callout{background:var(--herb-soft);border-radius:8px;padding:12px 14px;font-size:.92rem}
.err{color:var(--danger);font-weight:600;font-size:.9rem}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;margin-top:16px}
  nav.tabs{display:none}
  .chips{display:flex}
  .kbd{display:none}
  .recipe-body{grid-template-columns:1fr}
  .section-head h2{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px clamp(18px,5vw,36px);width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:2.2rem}
.login p{margin:0;color:var(--muted)}
.logout{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h1>ספר המתכונים שלי</h1>
    <p>הקלידו את הסיסמה המשפחתית כדי להיכנס.</p>
    <div class="f"><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="loginBtn">כניסה</button>
    <span class="err" id="loginErr"></span>
  </form>
</div>
<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <h1>ספר המתכונים שלי<small id="count">טוען מתכונים…</small></h1>
    <div class="actions"><button id="addBtn" class="btn">+ מתכון חדש</button></div>
  </header>
  <div class="bar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="search" type="search" placeholder="חיפוש לפי שם, מצרך או קטגוריה" aria-label="חיפוש מתכונים" autocomplete="off" enterkeyhint="search">
      <button id="clr" class="clear" type="button" aria-label="ניקוי החיפוש" hidden>✕</button>
      <span id="kbd" class="kbd" aria-hidden="true">/</span>
    </div>
    <div class="chips" id="chips" aria-label="קטגוריות"></div>
    <div class="result-line" id="resultLine" aria-live="polite"></div>
  </div>
  <div class="layout">
    <nav class="tabs" id="tabs" aria-label="קטגוריות"></nav>
    <main id="grid"></main>
  </div>
  <div class="status" id="status"></div>
  <button class="logout" id="logout" type="button">יציאה מהספר</button>
</div>
<div id="modal"></div>
</div>
<script>
const CATS=["עיקריות","מנות ראשונות","סלטים","מרקים","תוספות","מאפים ולחמים","עוגות וקינוחים","נשנושים","ארוחת בוקר","רטבים וממרחים","משקאות"];
let recipes=[], cat="הכל", query="", ready=false, wakeLock=null, PW="";
try{cat=localStorage.getItem("recipes.cat")||"הכל";}catch{}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines=t=>String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);

/* Search normalisation: ignore niqqud, quote marks, case and final letters, so "עוף" finds "עופות" and "קציצות" finds "קְצִיצוֹת". */
const SKIP=/[֑-ׇ״"׳'`]/;
const FINAL={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const nc=c=>FINAL[c]||c.toLowerCase();
function norm(s){let o="";for(const c of String(s??"")){if(!SKIP.test(c))o+=nc(c);}return o.replace(/\s+/g," ").trim();}
function terms(){return norm(query).split(" ").filter(Boolean);}
/* Wrap every match of the search terms in <mark>, mapping positions back to the original text. */
function hl(text,ts){
  text=String(text??"");if(!ts.length)return esc(text);
  let n="",map=[];[...text].forEach((c,i)=>{if(!SKIP.test(c)){const x=nc(c);for(const _ of x){n+=_;map.push(i);}}});
  const chars=[...text],on=new Array(chars.length).fill(false);
  ts.forEach(t=>{let i=n.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)on[map[k]]=true;i=n.indexOf(t,i+t.length);}});
  chars.forEach((c,i)=>{if(i&&on[i-1]&&SKIP.test(c))on[i]=true;});
  let out="",open=false;chars.forEach((c,i)=>{if(on[i]&&!open){out+="<mark>";open=true;}if(!on[i]&&open){out+="</mark>";open=false;}out+=esc(c);});
  return out+(open?"</mark>":"");
}
function index(r){
  r._t=norm(r.title);
  r._all=norm([r.title,r.category,r.intro,r.author,r.notes,...(r.ingredients||[]),...(r.steps||[])].join(" \n "));
  return r;
}
function matches(r,ts){return ts.every(t=>r._all.includes(t));}
/* Where else did it match? Show the first ingredient or step that holds a term the title lacks. */
function hitLine(r,ts){
  const missing=ts.filter(t=>!r._t.includes(t));if(!missing.length)return "";
  const ing=(r.ingredients||[]).find(x=>missing.some(t=>norm(x).includes(t)));
  if(ing)return `<p class="hit"><em>מצרך:</em> ${hl(ing,ts)}</p>`;
  const st=(r.steps||[]).find(x=>missing.some(t=>norm(x).includes(t)));
  if(st)return `<p class="hit"><em>בהכנה:</em> ${hl(st,ts)}</p>`;
  return "";
}

function catOrder(c){const i=CATS.indexOf(c);return i<0?CATS.length:i;}
function allCats(){const extra=[...new Set(recipes.map(r=>r.category).filter(c=>c&&!CATS.includes(c)))];return [...CATS,...extra];}
const byNew=(a,b)=>(b.createdAt||0)-(a.createdAt||0);

function card(r,ts,showTag){
  return `<button class="card" data-id="${esc(r.id)}">${showTag?`<span class="tag">${esc(r.category||"ללא קטגוריה")}</span>`:""}<h3>${hl(r.title,ts)}</h3>${ts.length?hitLine(r,ts):""}${r.intro&&!(ts.length&&hitLine(r,ts))?`<p>${hl(r.intro,ts)}</p>`:""}<div class="meta">${r.time?`<span>⏱ ${esc(r.time)}</span>`:""}${r.servings?`<span>${esc(r.servings)}</span>`:""}${r.author?`<span>${esc(r.author)}</span>`:""}</div></button>`;
}

function render(){
  const ts=terms();
  const pool=ts.length?recipes.filter(r=>matches(r,ts)):recipes;
  const counts={};pool.forEach(r=>{const c=r.category||"ללא קטגוריה";counts[c]=(counts[c]||0)+1;});
  const cats=Object.keys(counts).sort((a,b)=>catOrder(a)-catOrder(b)||a.localeCompare(b,"he"));
  if(cat!=="הכל"&&!cats.includes(cat)&&!ts.length&&recipes.length)cat="הכל";
  const tabCats=cats.includes(cat)||cat==="הכל"?cats:[...cats,cat];
  const tabsHtml=["הכל",...tabCats].map(c=>`<button class="${c===cat?"on":""}" data-cat="${esc(c)}" aria-pressed="${c===cat}"><span>${esc(c)}</span><span class="n">${c==="הכל"?pool.length:(counts[c]||0)}</span></button>`).join("");
  $("#tabs").innerHTML=tabsHtml;$("#chips").innerHTML=tabsHtml;
  const allCounts=new Set(recipes.map(r=>r.category));
  $("#count").textContent=recipes.length?`${recipes.length} מתכונים ב-${allCounts.size} קטגוריות`:(ready?"עדיין אין מתכונים":$("#count").textContent);
  $("#clr").hidden=!query;$("#kbd").hidden=!!query;

  let list=pool.filter(r=>cat==="הכל"||(r.category||"ללא קטגוריה")===cat);
  if(ts.length)list.sort((a,b)=>(ts.every(t=>b._t.includes(t))-ts.every(t=>a._t.includes(t)))||byNew(a,b));else list.sort(byNew);

  // result line
  const rl=$("#resultLine");
  if(ts.length){
    const inCat=cat==="הכל"?"":` בקטגוריה ${esc(cat)}`;
    rl.innerHTML=list.length?`נמצאו <b>${list.length}</b> מתכונים עבור ״${esc(query.trim())}״${inCat}`:`לא נמצאו מתכונים עבור ״${esc(query.trim())}״${inCat}`;
  }else rl.innerHTML=cat==="הכל"?"":`מציג <b>${list.length}</b> מתכונים בקטגוריה ${esc(cat)}`;

  const g=$("#grid");
  if(!recipes.length){
    g.innerHTML=ready?`<div class="empty"><strong>הספר ריק</strong>לחצו על ״מתכון חדש״ כדי להוסיף את המתכון הראשון.</div>`:`<div class="empty"><strong>טוען את הספר…</strong>המתכונים יופיעו כאן לפי קטגוריות.</div>`;return;
  }
  if(!list.length){
    const elsewhere=ts.length&&cat!=="הכל"&&pool.length;
    g.innerHTML=`<div class="empty"><strong>${ts.length?"לא מצאתי":"אין כאן מתכונים"}</strong>${elsewhere?`יש ${pool.length} תוצאות בקטגוריות אחרות.<br><button class="btn" data-cat="הכל">חיפוש בכל הקטגוריות</button>`:ts.length?"נסו מילה אחרת, או חלק ממילה (למשל ״עוג״ במקום ״עוגיות״).":"בחרו קטגוריה אחרת."}</div>`;return;
  }
  if(cat==="הכל"&&!ts.length){
    // grouped by category
    g.innerHTML=cats.map(c=>{const rs=list.filter(r=>(r.category||"ללא קטגוריה")===c);
      return `<section><div class="section-head"><h2>${esc(c)}<span class="n">${rs.length}</span></h2>${cats.length>1?`<button class="linkbtn" data-cat="${esc(c)}">רק ${esc(c)} ←</button>`:""}</div><div class="grid">${rs.map(r=>card(r,ts,false)).join("")}</div></section>`;}).join("");
  }else{
    g.innerHTML=`<div class="grid">${list.map(r=>card(r,ts,cat==="הכל")).join("")}</div>`;
  }
}
function setCat(c){cat=c;try{localStorage.setItem("recipes.cat",c);}catch{}render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b&&!b.closest("#modal"))setCat(b.dataset.cat);});
$("#q").oninput=e=>{const was=query;query=e.target.value;if(!was.trim()&&query.trim()&&cat!=="הכל")cat="הכל";render();};
$("#q").onkeydown=e=>{if(e.key==="Escape"&&query){e.stopPropagation();clearSearch();}};
function clearSearch(){query="";$("#q").value="";render();$("#q").focus();}
$("#clr").onclick=clearSearch;
document.addEventListener("keydown",e=>{if(e.key==="/"&&!$("#ov")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus();}});
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".card");if(b)openRecipe(b.dataset.id);});
$("#addBtn").onclick=()=>openForm(null);

function closeModal(){$("#modal").innerHTML="";releaseWake();document.body.style.overflow="";}
function shell(html){
  $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true"><button class="close" id="x" aria-label="סגירה">✕</button>${html}</div></div>`;
  document.body.style.overflow="hidden";
  $("#x").onclick=closeModal;$("#ov").onclick=e=>{if(e.target.id==="ov")closeModal();};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov"))closeModal();});

function openRecipe(id){
  const r=recipes.find(x=>x.id===id);if(!r)return;
  const ts=terms();
  const ing=(r.ingredients||[]).map((t,i)=>/[:：]$/.test(t)?`<li class="grp">${esc(t.replace(/[:：]$/,""))}</li>`:`<li><label><input type="checkbox" id="ing${i}"><span>${hl(t,ts)}</span></label></li>`).join("");
  const steps=(r.steps||[]).map(t=>`<li><span>${hl(t,ts)}</span></li>`).join("");
  shell(`<span class="tag">${esc(r.category||"ללא קטגוריה")}</span><h2>${esc(r.title)}</h2>
    ${r.intro?`<p class="intro">${esc(r.intro)}</p>`:""}
    <div class="facts">${r.author?`<span>${esc(r.author)}</span>`:""}${r.time?`<span>⏱ ${esc(r.time)}</span>`:""}${r.servings?`<span>${esc(r.servings)}</span>`:""}</div>
    <div class="recipe-body"><section><h4>מצרכים</h4><ul class="ing">${ing||"<li>—</li>"}</ul></section>
    <section><h4>אופן ההכנה</h4><ol class="steps" id="steps">${steps||"<li>—</li>"}</ol></section></div>
    ${r.notes?`<div class="notes"><strong>הערות: </strong>${esc(r.notes)}</div>`:""}
    <div class="sheet-foot"><div>${r.source?`מקור: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(shortUrl(r.source))}</a>`:""}</div>
    <div class="actions"><button class="btn ghost" id="cook">מסך דלוק בזמן בישול</button><button class="btn ghost" id="edit">עריכה</button><span id="delWrap"><button class="btn ghost" id="del">מחיקה</button></span></div></div>`);
  $("#steps").onclick=e=>{const li=e.target.closest("li");if(li)li.classList.toggle("done");};
  $("#edit").onclick=()=>openForm(r);
  $("#del").onclick=()=>{$("#delWrap").innerHTML=`<span class="confirm">למחוק לצמיתות? <button class="btn warn" id="yes">מחיקה</button><button class="btn ghost" id="no">ביטול</button></span>`;
    $("#no").onclick=()=>openRecipe(id);
    $("#yes").onclick=async()=>{try{await api("DELETE",null,id);recipes=recipes.filter(x=>x.id!==id);closeModal();render();}catch(e){$("#delWrap").innerHTML=`<span class="err">המחיקה נכשלה. נסו שוב.</span>`;}};};
  $("#cook").onclick=async()=>{try{wakeLock=await navigator.wakeLock.request("screen");$("#cook").textContent="המסך יישאר דלוק ✓";$("#cook").disabled=true;}catch{$("#cook").textContent="הדפדפן לא מאפשר";$("#cook").disabled=true;}};
}
function releaseWake(){try{wakeLock&&wakeLock.release();}catch{}wakeLock=null;}
function shortUrl(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch{return u;}}

function openForm(r){
  const isNew=!r; r=r||{};
  const catOpts=allCats().map(c=>`<option ${c===r.category?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">קטגוריה חדשה…</option>`;
  shell(`<h2>${isNew?"מתכון חדש":"עריכת מתכון"}</h2><form class="form" id="mf">
    <div class="f"><label for="fTitle">שם המתכון</label><input id="fTitle" required value="${esc(r.title)}"></div>
    <div class="row"><div class="f"><label for="fCat">קטגוריה</label><select id="fCat">${catOpts}</select><input id="fCatNew" placeholder="שם הקטגוריה" hidden></div>
      <div class="f"><label for="fTime">זמן</label><input id="fTime" value="${esc(r.time)}" placeholder="45 דקות"></div>
      <div class="f"><label for="fServ">כמות</label><input id="fServ" value="${esc(r.servings)}" placeholder="4 מנות"></div></div>
    <div class="row"><div class="f"><label for="fAuthor">מאת</label><input id="fAuthor" value="${esc(r.author)}"></div>
      <div class="f"><label for="fSrc">לינק למקור</label><input id="fSrc" dir="ltr" value="${esc(r.source)}"></div></div>
    <div class="f"><label for="fIntro">תיאור קצר</label><textarea id="fIntro" style="min-height:60px">${esc(r.intro)}</textarea></div>
    <div class="f"><label for="fIng">מצרכים</label><span class="hint">שורה לכל מצרך. שורה שמסתיימת בנקודתיים היא כותרת קבוצה, למשל ״לרוטב:״</span><textarea id="fIng" style="min-height:160px">${esc((r.ingredients||[]).join("\n"))}</textarea></div>
    <div class="f"><label for="fSteps">שלבי הכנה</label><span class="hint">שורה לכל שלב</span><textarea id="fSteps" style="min-height:180px">${esc((r.steps||[]).join("\n"))}</textarea></div>
    <div class="f"><label for="fNotes">הערות</label><textarea id="fNotes" style="min-height:60px">${esc(r.notes)}</textarea></div>
    <div class="actions"><button class="btn" type="submit" id="save">שמירה בספר</button><span id="sMsg" class="err"></span></div></form>`);
  $("#fCat").onchange=e=>{$("#fCatNew").hidden=e.target.value!=="__new";};
  if(r.category&&!allCats().includes(r.category)){$("#fCat").value="__new";$("#fCatNew").hidden=false;$("#fCatNew").value=r.category;}
  $("#mf").onsubmit=async e=>{
    e.preventDefault();
    const c=$("#fCat").value==="__new"?$("#fCatNew").value.trim()||"שונות":$("#fCat").value;
    const data={id:r.id,title:$("#fTitle").value.trim(),category:c,time:$("#fTime").value.trim(),servings:$("#fServ").value.trim(),author:$("#fAuthor").value.trim(),
      source:$("#fSrc").value.trim(),intro:$("#fIntro").value.trim(),ingredients:lines($("#fIng").value),steps:lines($("#fSteps").value),notes:$("#fNotes").value.trim(),createdAt:r.createdAt};
    $("#save").disabled=true;$("#sMsg").textContent="";
    try{const {recipe}=await api("POST",data);
      recipes=recipes.filter(x=>x.id!==recipe.id).concat(index(recipe));cat=c;render();openRecipe(recipe.id);}
    catch(err){$("#save").disabled=false;$("#sMsg").textContent=err.message;}
  };
}

/* Talking to the site's API. The family password travels in a header; a 401 sends the viewer back to the login screen. */
async function api(method,body,id){
  let res;
  try{res=await fetch("/api/recipes"+(id?`?id=${encodeURIComponent(id)}`:""),{method,headers:{"x-family-password":PW,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});}
  catch{throw new Error("אין חיבור לאינטרנט. נסו שוב.");}
  if(res.status===401){showLogin("הסיסמה השתנתה. הקלידו אותה שוב.");throw new Error("צריך להתחבר מחדש.");}
  const out=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(out.error==="no_password_configured"?"עוד לא הוגדרה סיסמה משפחתית באתר.":"הפעולה נכשלה. נסו שוב.");
  return out;
}
async function load(){
  const {recipes:list}=await api("GET");
  recipes=list.map(index);ready=true;render();
}
function showLogin(msg){$("#app").hidden=true;$("#login").hidden=false;$("#loginErr").textContent=msg||"";$("#pw").focus();}
async function enter(pw){
  PW=pw;$("#loginBtn").disabled=true;$("#loginErr").textContent="";
  try{
    const res=await fetch("/api/recipes",{headers:{"x-family-password":pw}});
    if(res.status===401){try{localStorage.removeItem("recipes.pw");}catch{}showLogin(pw?"הסיסמה לא נכונה.":"");return;}
    const out=await res.json();
    if(!res.ok)throw new Error(out.error==="no_password_configured"?"עוד לא הוגדרה סיסמה משפחתית באתר.":"לא הצלחתי לטעון את הספר.");
    try{localStorage.setItem("recipes.pw",pw);}catch{}
    recipes=out.recipes.map(index);ready=true;
    $("#login").hidden=true;$("#app").hidden=false;render();
  }catch(e){showLogin(e.message||"אין חיבור לאינטרנט. נסו שוב.");}
  finally{$("#loginBtn").disabled=false;}
}
$("#loginForm").onsubmit=e=>{e.preventDefault();enter($("#pw").value);};
$("#logout").onclick=()=>{try{localStorage.removeItem("recipes.pw");}catch{}PW="";recipes=[];ready=false;$("#pw").value="";showLogin();};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ready)load().catch(()=>{});});

let saved="";try{saved=localStorage.getItem("recipes.pw")||"";}catch{}
if(saved)enter(saved);else showLogin();
</script>

</body>
